name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }}${{ matrix.yaml && ', pyyaml' || ', stdlib only' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        yaml: [true, false]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # SkillSniff must behave identically with and without PyYAML, because
      # otherwise a security result depends on whether an optional extra
      # happened to be installed.
      - name: Remove PyYAML
        if: ${{ !matrix.yaml }}
        run: python -m pip uninstall -y PyYAML types-PyYAML
      - name: Confirm backend
        run: |
          python -c "from skillsniff.parse.frontmatter import HAVE_PYYAML; print('pyyaml:', HAVE_PYYAML)"
      - name: Run tests
        run: python -m pytest -q

  no-dependencies:
    name: runs with zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No install step at all. This is the property that lets the gate run
      # anywhere, and it is easy to lose by accident.
      - name: Import and run from source
        run: |
          PYTHONPATH=src python -c "import skillsniff.cli, skillsniff.engine; print('stdlib only: ok')"
          PYTHONPATH=src python -m skillsniff --version
          PYTHONPATH=src python -m skillsniff rules >/dev/null
          PYTHONPATH=src python -m skillsniff scan src/skillsniff/bench/corpus/benign/markdown-formatter --no-color

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" types-PyYAML
      - run: python -m ruff check src tests
      - run: python -m mypy

  docs:
    name: generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      # docs/RULES.md is generated from the registry. If it drifts, the
      # catalogue is lying about what the tool actually runs.
      - name: Regenerate and diff
        run: |
          python scripts/gen_rules_doc.py
          git diff --exit-code docs/RULES.md \
            || { echo "::error::docs/RULES.md is stale; run scripts/gen_rules_doc.py"; exit 1; }

  benchmark:
    name: SkillSniffBench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run the corpus
        run: python -m skillsniff benchmark --format json -o benchmark.json
      - name: Fail on any regression
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("benchmark.json"))
          overall = report["overall"]
          failures = report["expectation_failures"]
          print(f"precision {overall['precision']}  recall {overall['recall']}  F1 {overall['f1']}")
          print(f"TP {overall['true_positive']}  FP {overall['false_positive']}  "
                f"TN {overall['true_negative']}  FN {overall['false_negative']}")
          problems = []
          if overall["false_negative"]:
              problems.append(f"{overall['false_negative']} missed malicious case(s)")
          if overall["false_positive"]:
              problems.append(f"{overall['false_positive']} false positive(s)")
          if failures:
              problems.append(f"{len(failures)} expectation failure(s): "
                              + ", ".join(f["case"] for f in failures))
          if problems:
              print("::error::" + "; ".join(problems))
              sys.exit(1)
          print("benchmark clean")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json

  self-scan:
    name: self-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      # The reference skills in examples/ were written for this project's
      # predecessor, against a different rule set, before any current rule
      # existed. They are the only skills here not authored alongside the rules
      # that judge them, which makes this job worth more than a formality — it
      # already caught one real false positive.
      #
      # The benchmark corpus is excluded because it is deliberately malicious;
      # the SkillSniffBench job is what verifies that.
      - name: The self-scan must have something to scan
        run: |
          count=$(find ./examples/skills -name SKILL.md | wc -l)
          echo "reference skills: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::self-scan found no skills; this job would pass vacuously"
            exit 1
          fi

      - name: Scan the reference skills
        run: |
          python -m skillsniff scan ./examples/skills --format sarif -o skillsniff.sarif
          python -m skillsniff scan ./examples/skills --no-color --fail-on high

      # Anything the repository ships as an example must clear the strictest
      # bar, not merely the default one.
      - name: Reference skills must be clean under --strict
        run: python -m skillsniff scan ./examples/skills --no-color --strict
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: skillsniff.sarif
          category: skillsniff-self-scan

  # An action that is never executed is the most likely thing to be broken for
  # a first-time user, and it fails in the place where a newcomer has the least
  # patience. `uses: ./` runs this repository's own action definition.
  action:
    name: the action runs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the action against the reference skills
        id: clean
        uses: ./
        with:
          path: ./examples/skills
          fail-on: high
          sarif: "false"      # no security-events permission in this job
          comment: "false"    # not a pull request from the action's perspective

      - name: The action must report a clean verdict and expose its outputs
        run: |
          echo "verdict=${{ steps.clean.outputs.verdict }}"
          echo "findings=${{ steps.clean.outputs.findings }}"
          echo "critical=${{ steps.clean.outputs.critical }}"
          [ "${{ steps.clean.outputs.verdict }}" = "CLEAR" ] || {
            echo "::error::expected CLEAR on the reference skills"
            exit 1
          }
          [ "${{ steps.clean.outputs.critical }}" = "0" ] || {
            echo "::error::expected 0 critical findings"
            exit 1
          }

      # The gate has to actually fail on something bad, or it is decoration.
      - name: Run the action against a known-malicious corpus case
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          path: ./src/skillsniff/bench/corpus/malicious/exfil-env-to-network
          fail-on: high
          sarif: "false"
          comment: "false"

      - name: The action must fail on a malicious skill
        run: |
          echo "outcome=${{ steps.dirty.outcome }} verdict=${{ steps.dirty.outputs.verdict }}"
          [ "${{ steps.dirty.outcome }}" = "failure" ] || {
            echo "::error::the action did not fail on a skill with a critical finding"
            exit 1
          }
          [ "${{ steps.dirty.outputs.verdict }}" = "BLOCK" ] || {
            echo "::error::expected BLOCK, got '${{ steps.dirty.outputs.verdict }}'"
            exit 1
          }

  # pre-commit is the other packaged integration nobody would notice breaking.
  precommit:
    name: the pre-commit hook runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pre-commit
      - name: Run the hook against this repository
        run: |
          cat > /tmp/pre-commit-config.yaml <<'CFG'
          repos:
            - repo: .
              rev: HEAD
              hooks:
                - id: skillsniff
          CFG
          # try-repo builds the hook from this checkout and runs it, which
          # exercises the entry point, the file filter and the path resolution.
          pre-commit try-repo . skillsniff \
            --verbose \
            --files examples/skills/threat-model-review/SKILL.md \
                    examples/skills/feature-spec/SKILL.md

      - name: The hook must fail on a malicious skill
        run: |
          if pre-commit try-repo . skillsniff --verbose \
               --files src/skillsniff/bench/corpus/malicious/exfil-env-to-network/SKILL.md; then
            echo "::error::the pre-commit hook passed a skill with a critical finding"
            exit 1
          fi
          echo "hook correctly rejected the malicious skill"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Verify the wheel installs and runs with no dependencies pulled in.
      # The corpus is deliberately-malicious sample code. Shipping it in the
      # wheel would drop attack payloads and credential-shaped strings into
      # every site-packages directory, where users' own scanners find them.
      # setuptools sweeps stray .py files into packages by default, so this
      # needs asserting rather than assuming.
      - name: The wheel must not contain the benchmark corpus
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          leaked = [n for n in zipfile.ZipFile(wheel).namelist() if "bench/corpus" in n]
          if leaked:
              print(f"::error::wheel ships {len(leaked)} corpus file(s): {leaked[:5]}")
              sys.exit(1)
          print("wheel is free of corpus content")
          PY

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          installed=$(/tmp/check/bin/pip list --format=freeze | grep -viE '^(pip|setuptools|wheel)=' || true)
          echo "installed: $installed"
          if [ "$installed" != "skillsniff==$(/tmp/check/bin/python -c 'import skillsniff; print(skillsniff.__version__)')" ]; then
            echo "::error::the wheel pulled in runtime dependencies"
            exit 1
          fi
          /tmp/check/bin/skillsniff --version
          /tmp/check/bin/skillsniff rules > /dev/null
          /tmp/check/bin/skillsniff scan src/skillsniff/bench/corpus/benign/code-reviewer --no-color
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
